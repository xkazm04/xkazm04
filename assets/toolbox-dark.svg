  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .cursor, .fade { animation: none; stroke-dashoffset: 0; opacity: 1; }
  }
</style>

