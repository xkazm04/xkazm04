<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Weekly contribution pulse and language donut">
<style>
  text { font-family: 'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; }
  .draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.6s ease-out .2s forwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .fade { opacity: 0; animation: fade .8s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .cursor, .fade { animation: none; stroke-dashoffset: 0; opacity: 1; }
  }
</style>

