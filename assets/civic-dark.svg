<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="politicas: Czech public-accountability knowledge graph in numbers">
<style>
  text { font-family: 'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; }
  .draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.6s ease-out .2s forwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .fade { opacity: 0; animation: fade .8s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .cursor, .fade { animation: none; stroke-dashoffset: 0; opacity: 1; }
  }
</style>

<defs>
  <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#151A21" stroke-width="1"/>
  </pattern>
  <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse">
    <rect width="120" height="120" fill="url(#minor)"/>
    <path d="M120 0H0V120" fill="none" stroke="#1E252E" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="400" fill="#0B0D10"/>
<rect width="1200" height="400" fill="url(#major)"/>
